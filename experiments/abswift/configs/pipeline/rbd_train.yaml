# pipeline for Random Building Dataset and AB-SWIFT
# configuration matching the abswift paper

kind: abswift.pipelines.atmo_pipeline.AtmoPipeline

num_terrain_points: 4096 
num_obstacles_points: 4096

num_terrain_supernodes: 1024
num_obstacles_supernodes: 1024
num_volume_anchor_points: 8192

use_query_positions: false

data_specs: ${data_specs}