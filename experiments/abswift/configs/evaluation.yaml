# @package _global_

#stage_name: eval

defaults:
  - datasets: eval_datasets
  - pipeline@ls_pipeline: ls_pipeline
  - pipeline@vls_pipeline: vls_pipeline
  - callbacks: inference_callbacks
  - _self_

#defaults from training config
pipeline: #reapeat all key bcs we want to copy everything except use_query_position
  kind:  ${datasets[train].pipeline.kind}
  num_terrain_points: ${datasets[train].pipeline.num_terrain_points}
  num_obstacles_points: ${datasets[train].pipeline.num_obstacles_points}

  num_terrain_supernodes: ${datasets[train].pipeline.num_terrain_supernodes}
  num_obstacles_supernodes: ${datasets[train].pipeline.num_obstacles_supernodes}
  num_volume_anchor_points: ${datasets[train].pipeline.num_volume_anchor_points}

  data_specs: ${data_specs}
  use_query_positions: true

data_specs: ${model.data_specs}
dataset_normalizers: ${datasets[train].dataset_normalizers}

trainer:
  callbacks:
    ${callbacks}

hydra:
  searchpath:
    - configs
